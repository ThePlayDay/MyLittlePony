spring.application.name=pony-cards
server.port=${PORT:8099}
spring.datasource.url=jdbc:h2:file:./data/pony-cards-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.sql.init.encoding=UTF-8

# TEST ONLY: automatically unlock all 30 cards for local checking.
# Set to false before publishing/deploying the game.
pony.cards.test-mode=false
